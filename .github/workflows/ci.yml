name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Hook + bridge unit tests (no hardware: the USB/WiFi transports run
      # against a fake device on a loopback socket; pyserial for the USB one).
      - name: Python tests
        working-directory: tools
        run: |
          pip install pyserial
          python -m unittest -v test_buddy_hook test_buddy_bridge

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Build only -- never upload from CI.
      - name: Build firmware
        run: pio run -e cyd
